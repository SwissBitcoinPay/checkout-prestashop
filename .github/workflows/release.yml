name: Release

# A maintainer pushes a tag vX.Y.Z on a commit of main (never a development or agent session).
# This workflow runs the CI again, checks that the tag is the module's version (sattleme.php,
# config.xml and CHANGELOG.md's section "## X.Y.Z - <date>") and that its commit is on main, builds
# the module's ZIP from the lockfile and checks it (tools/build.sh: build/sattleme.zip, named as
# PrestaShop takes a module), then, once the CI passed, keeps it with its SHA-256 as the workflow's
# artifact, for 90 days. Then, approved by a maintainer in the protected environment "release", a
# draft GitHub release of the tag gets that ZIP and its SHA256SUMS, with the CHANGELOG's section of
# the version as its notes; a maintainer publishes the draft by hand (releases are immutable once
# published). The module is distributed only through this repository's GitHub releases: a
# merchant uploads the ZIP in PrestaShop's Module Manager. See README.md, "Releases".
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  COMPOSER_URL: https://getcomposer.org/download/2.11.2/composer.phar
  COMPOSER_SHA256: dd158c0afd41d15fac89e1b4e47b5d42911fe316c3687cd5edac98319b25d028

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  build:
    name: Check the tag, build the ZIP and keep it
    # Kept only once the CI passed on the tag's commit.
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PHP_VERSION: 8.4.23
      PHP_SHA256: 5fa2b5f1cc9d7f79b19718926b4f4f0bb6949db52073b2fabf8ae52de3993af5
      SCOPER_URL: https://github.com/humbug/php-scoper/releases/download/0.18.20/php-scoper.phar
      SCOPER_SHA256: 5e35e4a89ea53b2c70a19bfa8a856e4f9080aa12eb13a5bce650bb69d08eb122
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Every branch's history, to tell whether the tag's commit is on main.
          fetch-depth: 0
      - name: The tag is vX.Y.Z, the version of the module, on a commit of main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! echo "$TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "::error::$TAG is not vX.Y.Z"
            exit 1
          fi
          version="${TAG#v}"
          class="$(sed -n "s/^    public const VERSION = '\(.*\)';$/\1/p" sattleme/sattleme.php)"
          config="$(sed -n 's/^ *<version><!\[CDATA\[\(.*\)\]\]><\/version>$/\1/p' sattleme/config.xml)"
          if [ "$class" != "$version" ] || [ "$config" != "$version" ]; then
            echo "::error::The module declares $class (sattleme.php) and $config (config.xml), the tag is $TAG"
            exit 1
          fi
          # Its section's heading: "## <version> - <date>", the date in ISO 8601.
          if ! grep -Eqx "## ${version//./\\.} - [0-9]{4}-[0-9]{2}-[0-9]{2}" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section \"## $version - <date>\""
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "::error::The commit of $TAG is not on main"
            exit 1
          fi
      - name: PHP ${{ env.PHP_VERSION }} and Composer, their checksums checked
        run: |
          mkdir -p "$RUNNER_TEMP/php" "$RUNNER_TEMP/composer"
          curl -fsSL -o "$RUNNER_TEMP/php.tar.gz" "https://dl.static-php.dev/static-php-cli/bulk/php-$PHP_VERSION-cli-linux-x86_64.tar.gz"
          echo "$PHP_SHA256  $RUNNER_TEMP/php.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/php.tar.gz" -C "$RUNNER_TEMP/php" php
          curl -fsSL -o "$RUNNER_TEMP/php/composer" "$COMPOSER_URL"
          echo "$COMPOSER_SHA256  $RUNNER_TEMP/php/composer" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/php/composer"
          printf 'zend.assertions=1\nerror_reporting=-1\nmemory_limit=1G\n' > "$RUNNER_TEMP/php/php.ini"
          { echo "PHPRC=$RUNNER_TEMP/php"; echo "COMPOSER_HOME=$RUNNER_TEMP/composer"; } >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/php" >> "$GITHUB_PATH"
      # The build's tools: Composer installs the runtime libraries from the lockfile.
      - run: composer install --no-interaction --no-progress
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ github.token }}"}}'
      - name: PHP-Scoper, its checksum checked
        run: |
          mkdir -p build
          curl -fsSL -o build/php-scoper.phar "$SCOPER_URL"
          echo "$SCOPER_SHA256  build/php-scoper.phar" | sha256sum -c -
      # From the lockfile, its libraries prefixed, zipped reproducibly, checked as PrestaShop's
      # upload and the Addons validator check a module (tools/check-zip.php).
      - name: The module's ZIP, its libraries prefixed, checked
        run: sh tools/build.sh build/php-scoper.phar
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ github.token }}"}}'
      - name: The ZIP's SHA-256
        run: |
          cd build
          sha256sum sattleme.zip | tee SHA256SUMS
      # The ZIP the team uploads to PrestaShop Addons, and its hash: the run's artifact.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sattleme-${{ github.ref_name }}
          path: |
            build/sattleme.zip
            build/SHA256SUMS
          if-no-files-found: error
          retention-days: 90

  release:
    name: Draft release
    # Once the ZIP is built, checked and kept, from the tag's commit, the CI passed.
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Required reviewer: a maintainer approves each release (README.md, "Releases"). The only job
    # that can write the repository's contents, with this run's own token; no other secret.
    environment: release
    permissions:
      contents: write
    steps:
      # For CHANGELOG.md, the notes of the version.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The ZIP the build kept in this run, and its SHA256SUMS.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sattleme-${{ github.ref_name }}
          path: release
      - name: The ZIP against its SHA-256, and the notes of the version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          test "$(find release -type f | LC_ALL=C sort | tr '\n' ' ')" = "release/SHA256SUMS release/sattleme.zip "
          (cd release && sha256sum --check --strict SHA256SUMS)
          # The CHANGELOG's section of the version, without its heading, then how to install.
          awk -v heading="## $version - " 'index($0, heading) == 1 { found = 1; next } found && /^## / { exit } found { print }' \
            CHANGELOG.md > notes.md
          test -s notes.md
          {
            echo
            echo "## Installation"
            echo
            echo "Download \`sattleme.zip\`, check it against \`SHA256SUMS\` (\`sha256sum -c SHA256SUMS\`), then upload it in PrestaShop's back office: **Modules → Module Manager → Upload a module** (README, \"Installation\")."
            echo
            echo "\`\`\`"
            cat release/SHA256SUMS
            echo "\`\`\`"
          } >> notes.md
          cat release/SHA256SUMS | tee -a "$GITHUB_STEP_SUMMARY"
      # A draft: nothing is published until a maintainer publishes it. Refused if the tag has a
      # release already, draft or not; then its files are read back from the draft and compared.
      - name: Draft release ${{ github.ref_name }}, its files read back
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          existing="$(gh api --paginate "repos/$GH_REPO/releases" --jq '.[] | select(.tag_name == env.TAG) | .id')"
          if [ -n "$existing" ]; then
            echo "::error::$TAG has a release already: delete the draft to make it again"
            exit 1
          fi
          gh release create "$TAG" release/sattleme.zip release/SHA256SUMS --draft --verify-tag \
            --title "sattle.me for PrestaShop ${TAG#v}" --notes-file notes.md
          id="$(gh api --paginate "repos/$GH_REPO/releases" --jq '.[] | select(.tag_name == env.TAG and .draft) | .id')"
          test -n "$id"
          test "$(printf '%s\n' "$id" | wc -l)" -eq 1
          mkdir check
          for name in sattleme.zip SHA256SUMS; do
            asset="$(gh api "repos/$GH_REPO/releases/$id/assets" --jq ".[] | select(.name == \"$name\") | .id")"
            test -n "$asset"
            gh api -H "Accept: application/octet-stream" "repos/$GH_REPO/releases/assets/$asset" > "check/$name"
            cmp "check/$name" "release/$name"
          done
          echo "Draft release $TAG made: publish it once read." | tee -a "$GITHUB_STEP_SUMMARY"
