name: CI

# Every pull request and every push to main (and the release workflow, before it builds): the
# coding standard, the translations, the pinned SDK, the module's ZIP built from the lockfile and
# checked as PrestaShop's upload checks a module, and the static analysis against PrestaShop's own
# sources, on one job; the unit tests of the ZIP's code on every PHP version the module supports;
# the integration and HTTP tests in a shop of each PrestaShop minor version it supports, with the
# module installed from the ZIP; the end-to-end test on PrestaShop's own Docker image of each of
# those versions, the module uploaded in its back office. The tests never reach the network: the
# SDK is faked.
#
# PHP is a static build of static-php-cli (dl.static-php.dev, its "bulk" set of extensions),
# Composer its phar, the shop's database MariaDB's binary archive, PrestaShop its release ZIP, each
# checked against its SHA-256 (tests/shop/shop.sh).
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  COMPOSER_URL: https://getcomposer.org/download/2.11.2/composer.phar
  COMPOSER_SHA256: dd158c0afd41d15fac89e1b4e47b5d42911fe316c3687cd5edac98319b25d028

jobs:
  checks:
    name: Coding standard, static analysis, the ZIP
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PHP_VERSION: 8.4.23
      PHP_SHA256: 5fa2b5f1cc9d7f79b19718926b4f4f0bb6949db52073b2fabf8ae52de3993af5
      SCOPER_URL: https://github.com/humbug/php-scoper/releases/download/0.18.20/php-scoper.phar
      SCOPER_SHA256: 5e35e4a89ea53b2c70a19bfa8a856e4f9080aa12eb13a5bce650bb69d08eb122
      # The PrestaShop the static analysis reads: the newest minor version supported.
      PRESTASHOP: 9.2.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # PHP and Composer in RUNNER_TEMP, PHP's ini there too (PHPRC), Composer's home as well.
      - name: PHP ${{ env.PHP_VERSION }} and Composer, their checksums checked
        run: |
          mkdir -p "$RUNNER_TEMP/php" "$RUNNER_TEMP/composer"
          curl -fsSL -o "$RUNNER_TEMP/php.tar.gz" "https://dl.static-php.dev/static-php-cli/bulk/php-$PHP_VERSION-cli-linux-x86_64.tar.gz"
          echo "$PHP_SHA256  $RUNNER_TEMP/php.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/php.tar.gz" -C "$RUNNER_TEMP/php" php
          curl -fsSL -o "$RUNNER_TEMP/php/composer" "$COMPOSER_URL"
          echo "$COMPOSER_SHA256  $RUNNER_TEMP/php/composer" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/php/composer"
          printf 'zend.assertions=1\nerror_reporting=-1\nmemory_limit=1G\n' > "$RUNNER_TEMP/php/php.ini"
          { echo "PHPRC=$RUNNER_TEMP/php"; echo "COMPOSER_HOME=$RUNNER_TEMP/composer"; } >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/php" >> "$GITHUB_PATH"
      - run: php -r "echo PHP_VERSION, ' ', OPENSSL_VERSION_TEXT, PHP_EOL;"
      - run: composer validate
      # Composer downloads the packages from GitHub's API with the job's token, as setup-php has
      # it do: anonymous, the runners would share 60 requests an hour.
      - run: composer install --no-interaction --no-progress
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ github.token }}"}}'
      - name: PrestaShop's coding standard
        run: vendor/bin/php-cs-fixer check --diff
      - name: The translations (French, German, Italian)
        run: php tools/translations.php check
      - name: The user guides' PDFs, the ones their sources give
        run: php tools/docs.php check
      - name: The pinned SDK, file by file
        run: php tools/sdk.php check
      - name: PHP-Scoper, its checksum checked
        run: |
          mkdir -p build
          curl -fsSL -o build/php-scoper.phar "$SCOPER_URL"
          echo "$SCOPER_SHA256  build/php-scoper.phar" | sha256sum -c -
      - name: The module's ZIP, its libraries prefixed, checked
        run: sh tools/build.sh build/php-scoper.phar
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ github.token }}"}}'
      - name: PrestaShop ${{ env.PRESTASHOP }}'s sources, for the static analysis
        run: sh tests/shop/shop.sh sources "$PRESTASHOP" build/prestashop
      - name: PHPStan, its strictest level
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress
        env:
          _PS_ROOT_DIR_: ${{ github.workspace }}/build/prestashop
      - name: The ZIP's checksum
        run: sha256sum build/sattleme.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: module
          path: build/sattleme.zip
          if-no-files-found: error
          retention-days: 7

  tests:
    name: Tests (${{ matrix.label }})
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # The unit tests on every PHP version the module supports (composer.json: 8.2 or later;
        # 8.5, the newest PrestaShop supports). The integration and HTTP tests in each minor
        # version of PrestaShop the module supports (9.0 to 9.2), its newest patch release, on a
        # PHP version it supports (9.0: PHP 8.1 to 8.4; 9.1 and 9.2: 8.1 to 8.5).
        include:
          - label: PHP 8.2, PrestaShop 9.0.3
            php: 8.2.32
            sha256: 866532d2b463ff256d063432d529e966cc53e4a039109ccbfc4ee4dc51d649f1
            prestashop: 9.0.3
          - label: PHP 8.3
            php: 8.3.32
            sha256: 7928396c17aabcd5bb074fe82e07b4cb693c6d04360a4415799a143a9f9686c6
            prestashop: ""
          - label: PHP 8.4, PrestaShop 9.1.5
            php: 8.4.23
            sha256: 5fa2b5f1cc9d7f79b19718926b4f4f0bb6949db52073b2fabf8ae52de3993af5
            prestashop: 9.1.5
          - label: PHP 8.5, PrestaShop 9.2.1
            php: 8.5.8
            sha256: bfaa12e0f6f5788259bc20d0d3f08e1e851bce7f05d43e38fb77041e12a32663
            prestashop: 9.2.1
    env:
      PHP_VERSION: ${{ matrix.php }}
      PHP_SHA256: ${{ matrix.sha256 }}
      PRESTASHOP: ${{ matrix.prestashop }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: PHP ${{ env.PHP_VERSION }} and Composer, their checksums checked
        run: |
          mkdir -p "$RUNNER_TEMP/php" "$RUNNER_TEMP/composer"
          curl -fsSL -o "$RUNNER_TEMP/php.tar.gz" "https://dl.static-php.dev/static-php-cli/bulk/php-$PHP_VERSION-cli-linux-x86_64.tar.gz"
          echo "$PHP_SHA256  $RUNNER_TEMP/php.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/php.tar.gz" -C "$RUNNER_TEMP/php" php
          curl -fsSL -o "$RUNNER_TEMP/php/composer" "$COMPOSER_URL"
          echo "$COMPOSER_SHA256  $RUNNER_TEMP/php/composer" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/php/composer"
          printf 'zend.assertions=1\nerror_reporting=-1\nmemory_limit=1G\n' > "$RUNNER_TEMP/php/php.ini"
          { echo "PHPRC=$RUNNER_TEMP/php"; echo "COMPOSER_HOME=$RUNNER_TEMP/composer"; } >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/php" >> "$GITHUB_PATH"
      - run: composer install --no-interaction --no-progress
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ github.token }}"}}'
      # The ZIP the checks built: the tests run its code and its prefixed libraries.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: module
          path: build
      - name: The unit tests
        run: vendor/bin/phpunit --testsuite unit
      # MariaDB and PrestaShop from their archives, the module installed from the ZIP, PHP's
      # built-in web server: build/shop, on ports of 127.0.0.1.
      - name: A PrestaShop ${{ env.PRESTASHOP }} shop
        if: matrix.prestashop != ''
        run: sh tests/shop/shop.sh setup "$PRESTASHOP"
      - name: The integration tests, in the shop
        if: matrix.prestashop != ''
        run: |
          eval "$(sh tests/shop/shop.sh env)"
          vendor/bin/phpunit --testsuite shop
      # And through PrestaShop 9.2's One Page Checkout, in a shop that has it.
      - name: The HTTP tests, through the shop's pages
        if: matrix.prestashop != ''
        run: |
          eval "$(sh tests/shop/shop.sh env)"
          unset SATTLEME_SHOP_ROOT
          suites=http
          if [ -d build/shop/www/modules/ps_onepagecheckout ]; then
            suites=http,opc
          fi
          vendor/bin/phpunit --testsuite "$suites"
      - name: The shop's logs
        if: failure() && matrix.prestashop != ''
        run: tail -n 200 build/shop/php-errors.log build/shop/web.log build/shop/db.log || true
      - name: Stop the shop
        if: always() && matrix.prestashop != ''
        run: sh tests/shop/shop.sh stop

  e2e:
    name: End to end (PrestaShop ${{ matrix.prestashop }}'s image, PHP ${{ matrix.image-php }})
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # PrestaShop's own image of each minor version the module supports, pinned by its digest:
        # on the newest PHP it supports (9.0: 8.4; 9.1 and 9.2: 8.5), and 9.2 on the module's
        # oldest (8.2). 9.2.0's: the images of 9.2.1 have one digest, pushed on 2026-11-21, not a
        # week old yet (the tests job runs 9.2.1 from its release ZIP); updated by hand.
        include:
          - prestashop: 9.0.3
            image-php: "8.4"
            image: prestashop/prestashop:9.0.3-3.0-classic-8.4-apache@sha256:bd05527bc324b43bf70458413be60181614fad62f71a63af2525362985207b3d
          - prestashop: 9.1.5
            image-php: "8.5"
            image: prestashop/prestashop:9.1.5-5.0-classic-8.5-apache@sha256:515336e3c1c50c5613f7cd7382b384fa095fba9d7d8497c80aeb3046c135c535
          - prestashop: 9.2.0
            image-php: "8.5"
            image: prestashop/prestashop:9.2.0-6.0-classic-8.5-apache@sha256:09c36d25a22fd52f6ab876e8d7564c2b6830ba27236f50ef770dc6a650a3208e
          - prestashop: 9.2.0
            image-php: "8.2"
            image: prestashop/prestashop:9.2.0-6.0-classic-8.2-apache@sha256:49f2c5d4136234f06d5512624f7c6fc548c4cdbbd344290c93a041304cd0b09e
    env:
      # The tests' PHP, on the runner.
      PHP_VERSION: 8.4.23
      PHP_SHA256: 5fa2b5f1cc9d7f79b19718926b4f4f0bb6949db52073b2fabf8ae52de3993af5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: PHP ${{ env.PHP_VERSION }} and Composer, their checksums checked
        run: |
          mkdir -p "$RUNNER_TEMP/php" "$RUNNER_TEMP/composer"
          curl -fsSL -o "$RUNNER_TEMP/php.tar.gz" "https://dl.static-php.dev/static-php-cli/bulk/php-$PHP_VERSION-cli-linux-x86_64.tar.gz"
          echo "$PHP_SHA256  $RUNNER_TEMP/php.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/php.tar.gz" -C "$RUNNER_TEMP/php" php
          curl -fsSL -o "$RUNNER_TEMP/php/composer" "$COMPOSER_URL"
          echo "$COMPOSER_SHA256  $RUNNER_TEMP/php/composer" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/php/composer"
          printf 'zend.assertions=1\nerror_reporting=-1\nmemory_limit=1G\n' > "$RUNNER_TEMP/php/php.ini"
          { echo "PHPRC=$RUNNER_TEMP/php"; echo "COMPOSER_HOME=$RUNNER_TEMP/composer"; } >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/php" >> "$GITHUB_PATH"
      - run: composer install --no-interaction --no-progress
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ github.token }}"}}'
      # The ZIP the checks built: the merchant uploads it.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: module
          path: build
      # PrestaShop's image installs a shop (Apache, friendly URLs on) on a MariaDB container; the
      # merchant uploads the ZIP in the back office's Module Manager; then the HTTP tests: the
      # key in the settings, an order placed, its payment page, the order paid (the SDK faked),
      # and on PrestaShop 9.2 an order placed through its One Page Checkout.
      - name: The module, uploaded in PrestaShop's back office, takes an order and its payment
        env:
          IMAGE: ${{ matrix.image }}
        run: sh tests/e2e/run.sh "$IMAGE"
